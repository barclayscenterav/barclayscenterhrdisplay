<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Barclays Center Employee Lounge
</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020617;
}

body{
  font-family:Arial,sans-serif;
}

/* =========================
   MAIN STAGE
========================= */

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;

  background-color:#020617;

  /*
    Keep background.jpg in the
    same GitHub folder as index.html
  */
  background-image:url("background.jpg");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

/*
  Slight dark overlay over the
  background image.

  Playlist media sits above this.
*/
#stage::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    rgba(0,0,0,0.15);

  z-index:0;

  pointer-events:none;
}

/* =========================
   MEDIA LAYERS
========================= */

.layer{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0;

  transition:
    opacity 0.6s ease;

  z-index:1;

  pointer-events:none;
}

.layer.active{
  opacity:1;
  z-index:2;
}

.media{
  width:100%;
  height:100%;

  /*
    Shows the entire image/video
    without stretching it.

    background.jpg remains visible
    around content that is not 16:9.
  */
  object-fit:contain;

  object-position:center;

  display:block;

  background:transparent;
}

</style>
</head>

<body>

<div id="stage">

  <div
    id="layerA"
    class="layer"
  ></div>

  <div
    id="layerB"
    class="layer"
  ></div>

</div>

<script>

/* =================================================
   CLOUDFLARE WORKER
================================================= */

const WORKER_URL =
  "https://barclays-employee-lounge-api.barclayscenterav.workers.dev";

/* =================================================
   SETTINGS
================================================= */

/*
  Check GitHub/Worker for playlist
  changes every 15 seconds.
*/
const PLAYLIST_CHECK_INTERVAL =
  15000;

/*
  Crossfade length between items.
*/
const FADE_TIME =
  600;

/*
  If media fails to load, wait this
  long before moving to another item.
*/
const FAILED_MEDIA_DELAY =
  1500;

/*
  Maximum amount of time we'll wait
  for a video to become playable.
*/
const VIDEO_LOAD_TIMEOUT =
  20000;

/* =================================================
   ELEMENTS
================================================= */

const layerA =
  document.getElementById(
    "layerA"
  );

const layerB =
  document.getElementById(
    "layerB"
  );

/* =================================================
   PLAYER STATE
================================================= */

let playlist =
  [];

let currentIndex =
  0;

let currentItemId =
  null;

let activeLayer =
  layerA;

let inactiveLayer =
  layerB;

let playbackTimer =
  null;

let transitionNumber =
  0;

let refreshRunning =
  false;

let playerStarted =
  false;

/* =================================================
   BASIC HELPERS
================================================= */

function cleanWorkerUrl(){

  return WORKER_URL
    .replace(/\/+$/,"");
}

function clearPlaybackTimer(){

  if(playbackTimer){

    clearTimeout(
      playbackTimer
    );

    playbackTimer =
      null;
  }
}

/* =================================================
   LAYER CLEANUP
================================================= */

function clearLayer(layer){

  const videos =
    layer.querySelectorAll(
      "video"
    );

  videos.forEach(
    video => {

      try{
        video.pause();
      }catch(error){}

      video.removeAttribute(
        "src"
      );

      try{
        video.load();
      }catch(error){}
    }
  );

  layer.innerHTML =
    "";

  layer.classList.remove(
    "active"
  );
}

function clearEverything(){

  transitionNumber++;

  clearPlaybackTimer();

  clearLayer(
    layerA
  );

  clearLayer(
    layerB
  );

  activeLayer =
    layerA;

  inactiveLayer =
    layerB;

  currentItemId =
    null;

  currentIndex =
    0;

  playerStarted =
    false;
}

/* =================================================
   FETCH PLAYLIST
================================================= */

async function fetchPlaylist(){

  const url =
    cleanWorkerUrl() +
    "/api/playlist?t=" +
    Date.now();

  const response =
    await fetch(
      url,
      {
        method:"GET",

        cache:"no-store",

        headers:{
          "Accept":
            "application/json"
        }
      }
    );

  if(!response.ok){

    throw new Error(
      "Unable to load playlist."
    );
  }

  const data =
    await response.json();

  if(
    !data ||
    !Array.isArray(
      data.items
    )
  ){

    return [];
  }

  return data.items;
}

/* =================================================
   REFRESH PLAYLIST
================================================= */

async function refreshPlaylist(){

  if(refreshRunning){
    return;
  }

  refreshRunning =
    true;

  try{

    const newPlaylist =
      await fetchPlaylist();

    const previousItemId =
      currentItemId;

    playlist =
      newPlaylist;

    /*
      Nothing published.
      Leave only the background visible.
    */

    if(!playlist.length){

      clearEverything();

      return;
    }

    /*
      Player has not started yet.
    */

    if(
      !playerStarted ||
      !previousItemId
    ){

      currentIndex =
        0;

      await showCurrentItem();

      return;
    }

    /*
      See whether the currently playing
      item still exists in the newly
      loaded playlist.
    */

    const existingIndex =
      playlist.findIndex(
        item =>
          String(item.id) ===
          String(previousItemId)
      );

    if(existingIndex >= 0){

      /*
        Current item is still published.

        Keep showing it, but update
        currentIndex so the NEXT item
        follows the newest saved order.
      */

      currentIndex =
        existingIndex;

      return;
    }

    /*
      Current item was unpublished
      or deleted.

      Move immediately to the first
      available published item.
    */

    currentIndex =
      0;

    await showCurrentItem();

  }catch(error){

    console.error(
      "Playlist refresh error:",
      error
    );

  }finally{

    refreshRunning =
      false;
  }
}

/* =================================================
   IMAGE LOADER
================================================= */

function createImage(item){

  return new Promise(
    (resolve,reject) => {

      const image =
        document.createElement(
          "img"
        );

      image.className =
        "media";

      image.alt =
        "";

      image.draggable =
        false;

      image.onload =
        () => {

          resolve(image);
        };

      image.onerror =
        () => {

          reject(
            new Error(
              "Image failed to load."
            )
          );
        };

      image.src =
        item.media_url;
    }
  );
}

/* =================================================
   VIDEO LOADER
================================================= */

function createVideo(item){

  return new Promise(
    (resolve,reject) => {

      const video =
        document.createElement(
          "video"
        );

      video.className =
        "media";

      video.autoplay =
        false;

      video.muted =
        true;

      video.defaultMuted =
        true;

      video.playsInline =
        true;

      video.controls =
        false;

      video.loop =
        false;

      video.preload =
        "auto";

      video.setAttribute(
        "playsinline",
        ""
      );

      video.setAttribute(
        "webkit-playsinline",
        ""
      );

      let finished =
        false;

      let timeout =
        null;

      function cleanup(){

        if(timeout){

          clearTimeout(
            timeout
          );

          timeout =
            null;
        }
      }

      function ready(){

        if(finished){
          return;
        }

        finished =
          true;

        cleanup();

        resolve(
          video
        );
      }

      function failed(){

        if(finished){
          return;
        }

        finished =
          true;

        cleanup();

        reject(
          new Error(
            "Video failed to load or is not supported by this browser."
          )
        );
      }

      /*
        loadeddata or canplay means we
        can transition to the video
        without intentionally showing
        a blank screen first.
      */

      video.addEventListener(
        "loadeddata",
        ready,
        {
          once:true
        }
      );

      video.addEventListener(
        "canplay",
        ready,
        {
          once:true
        }
      );

      video.addEventListener(
        "error",
        failed,
        {
          once:true
        }
      );

      video.src =
        item.media_url;

      video.load();

      timeout =
        setTimeout(
          failed,
          VIDEO_LOAD_TIMEOUT
        );
    }
  );
}

/* =================================================
   CREATE MEDIA
================================================= */

async function createMedia(item){

  const type =
    String(
      item.file_type || ""
    ).toLowerCase();

  if(
    type.startsWith(
      "image/"
    )
  ){

    return await createImage(
      item
    );
  }

  if(
    type.startsWith(
      "video/"
    )
  ){

    return await createVideo(
      item
    );
  }

  throw new Error(
    "Unsupported media type: " +
    type
  );
}

/* =================================================
   DETERMINE NEXT ITEM
================================================= */

function moveToNextItem(
  expectedItemId = null
){

  /*
    Prevent an old timer or ended
    event from advancing a newer item.
  */

  if(
    expectedItemId !== null &&
    String(currentItemId) !==
    String(expectedItemId)
  ){

    return;
  }

  if(!playlist.length){

    clearEverything();

    return;
  }

  /*
    Locate current item using the latest
    playlist order.

    This means reordering the playlist
    in admin affects the very next item.
  */

  const currentPosition =
    playlist.findIndex(
      item =>
        String(item.id) ===
        String(currentItemId)
    );

  if(currentPosition >= 0){

    currentIndex =
      (
        currentPosition + 1
      ) %
      playlist.length;

  }else{

    currentIndex =
      0;
  }

  showCurrentItem();
}

/* =================================================
   PLAY CURRENT ITEM
================================================= */

async function showCurrentItem(){

  clearPlaybackTimer();

  if(!playlist.length){

    clearEverything();

    return;
  }

  if(
    currentIndex < 0 ||
    currentIndex >=
      playlist.length
  ){

    currentIndex =
      0;
  }

  const item =
    playlist[
      currentIndex
    ];

  /*
    Each transition gets a unique number.

    If another playlist change occurs
    while media is still loading, the
    old transition is ignored.
  */

  const thisTransition =
    ++transitionNumber;

  let media;

  try{

    media =
      await createMedia(
        item
      );

  }catch(error){

    console.error(
      "Media load error:",
      item,
      error
    );

    /*
      Leave the previous item on screen
      instead of flashing to black.
    */

    if(
      thisTransition ===
      transitionNumber
    ){

      playbackTimer =
        setTimeout(
          () => {

            moveToNextItem();

          },
          FAILED_MEDIA_DELAY
        );
    }

    return;
  }

  /*
    Another transition started while
    this file was loading.
  */

  if(
    thisTransition !==
    transitionNumber
  ){

    if(
      media.tagName ===
      "VIDEO"
    ){

      try{
        media.pause();
      }catch(error){}
    }

    return;
  }

  /*
    Prepare the hidden layer while the
    current content remains visible.
  */

  clearLayer(
    inactiveLayer
  );

  inactiveLayer.appendChild(
    media
  );

  currentItemId =
    item.id;

  playerStarted =
    true;

  /* =========================
     VIDEO
  ========================= */

  if(
    media.tagName ===
    "VIDEO"
  ){

    const itemId =
      item.id;

    media.addEventListener(
      "ended",
      () => {

        moveToNextItem(
          itemId
        );

      },
      {
        once:true
      }
    );

    media.addEventListener(
      "error",
      () => {

        moveToNextItem(
          itemId
        );

      },
      {
        once:true
      }
    );

    try{

      media.currentTime =
        0;

      await media.play();

    }catch(error){

      console.error(
        "Video autoplay/playback error:",
        error
      );
    }
  }

  /* =========================
     CROSSFADE
  ========================= */

  const oldLayer =
    activeLayer;

  inactiveLayer.classList.add(
    "active"
  );

  oldLayer.classList.remove(
    "active"
  );

  activeLayer =
    inactiveLayer;

  inactiveLayer =
    oldLayer;

  /*
    Don't remove old content until the
    fade has completed.
  */

  setTimeout(
    () => {

      clearLayer(
        inactiveLayer
      );

    },
    FADE_TIME + 100
  );

  /* =========================
     DURATION
  ========================= */

  const durationSeconds =
    Math.max(
      1,
      Number(
        item.duration_seconds ||
        10
      )
    );

  /*
    Images always use the playlist
    duration.
  */

  if(
    media.tagName ===
    "IMG"
  ){

    playbackTimer =
      setTimeout(
        () => {

          moveToNextItem(
            item.id
          );

        },
        durationSeconds *
        1000
      );

    return;
  }

  /*
    Videos normally advance using their
    native "ended" event.

    This backup timer prevents a broken
    browser/player from leaving the
    display stuck forever.
  */

  playbackTimer =
    setTimeout(
      () => {

        moveToNextItem(
          item.id
        );

      },
      (
        durationSeconds +
        5
      ) *
      1000
    );
}

/* =================================================
   TAB / DISPLAY RECOVERY
================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState !==
      "visible"
    ){
      return;
    }

    /*
      Immediately check for playlist
      changes when the browser/display
      becomes active again.
    */

    refreshPlaylist();

    /*
      Resume active video if the browser
      paused it while the tab was hidden.
    */

    const activeVideo =
      activeLayer.querySelector(
        "video"
      );

    if(activeVideo){

      activeVideo
        .play()
        .catch(
          error => {

            console.error(
              "Unable to resume video:",
              error
            );
          }
        );
    }
  }
);

/* =================================================
   ONLINE RECOVERY
================================================= */

window.addEventListener(
  "online",
  () => {

    refreshPlaylist();
  }
);

/* =================================================
   START PLAYER
================================================= */

refreshPlaylist();

/*
  Continue checking for changes.

  Changes made in admin should reach
  the display within approximately
  15 seconds.
*/

setInterval(
  refreshPlaylist,
  PLAYLIST_CHECK_INTERVAL
);

</script>

</body>
</html>
