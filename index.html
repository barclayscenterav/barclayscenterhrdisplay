<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HR Display Playlist</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#020617;
  color:white;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

#stage{
  position:fixed;
  inset:0;
  background:#020617;
  display:flex;
  align-items:center;
  justify-content:center;
}

.media{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#020617;
}

iframe.media{
  border:none;
}

#empty{
  text-align:center;
  color:#cbd5e1;
  font-size:2rem;
  padding:30px;
  line-height:1.35;
}

#overlay{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:18px 28px;
  background:linear-gradient(
    to top,
    rgba(0,0,0,0.75),
    rgba(0,0,0,0)
  );
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-end;
  pointer-events:none;
}

#title{
  font-size:1.6rem;
  font-weight:900;
  text-transform:uppercase;
  text-shadow:0 2px 8px rgba(0,0,0,0.8);
}

#counter{
  font-size:1rem;
  color:#cbd5e1;
  font-weight:bold;
  text-shadow:0 2px 8px rgba(0,0,0,0.8);
}

#debug{
  position:fixed;
  top:10px;
  left:10px;
  background:rgba(0,0,0,0.7);
  color:#cbd5e1;
  font-size:13px;
  padding:8px 10px;
  border-radius:8px;
  z-index:10;
  max-width:90vw;
  word-break:break-word;
}

.hidden{
  display:none !important;
}
</style>
</head>

<body>

<div id="stage">
  <div id="empty">
    Loading playlist...
  </div>
</div>

<div id="overlay" class="hidden">
  <div id="title"></div>
  <div id="counter"></div>
</div>

<div id="debug"></div>

<script type="module">
import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
  "https://scnlepcadipdhhzppovq.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_FSLIkrVTT9GkAxXjTWoWTw_g9_BsURe";

/* =========================
   CLIENT
========================= */

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

/* =========================
   ELEMENTS
========================= */

const stage =
  document.getElementById("stage");

const overlay =
  document.getElementById("overlay");

const titleEl =
  document.getElementById("title");

const counter =
  document.getElementById("counter");

const debug =
  document.getElementById("debug");

/* =========================
   STATE
========================= */

let playlist =
  [];

let currentIndex =
  0;

let timer =
  null;

let hasStarted =
  false;

let realtimeChannel =
  null;

/* =========================
   HELPERS
========================= */

function setDebug(message){

  debug.innerText =
    message || "";
}

function isImage(fileType){

  return fileType &&
    fileType.startsWith("image/");
}

function isVideo(fileType){

  return fileType &&
    fileType.startsWith("video/");
}

function isPdf(fileType){

  return fileType === "application/pdf";
}

function clearTimer(){

  if(timer){
    clearTimeout(timer);
    timer = null;
  }
}

function showEmpty(message){

  clearTimer();

  stage.innerHTML =
    "";

  const div =
    document.createElement("div");

  div.id =
    "empty";

  div.innerText =
    message;

  stage.appendChild(
    div
  );

  overlay.classList.add(
    "hidden"
  );
}

function scheduleNext(seconds){

  const safeSeconds =
    Math.max(
      1,
      Number(seconds || 10)
    );

  timer =
    setTimeout(
      nextItem,
      safeSeconds * 1000
    );
}

function nextItem(){

  clearTimer();

  if(!playlist.length){

    showEmpty(
      "No active playlist items."
    );

    return;
  }

  currentIndex =
    (currentIndex + 1) % playlist.length;

  showItem(
    currentIndex
  );
}

/* =========================
   LOAD PLAYLIST
========================= */

async function loadPlaylist(options = {}){

  const shouldRestart =
    options.restart === true;

  const shouldKeepCurrent =
    options.keepCurrent === true;

  const oldId =
    playlist[currentIndex]?.id || null;

  setDebug(
    "Checking playlist..."
  );

  const result =
    await supabase
      .from("playlist_items")
      .select("*")
      .eq("is_active",true)
      .order(
        "sort_order",
        {
          ascending:true
        }
      );

  if(result.error){

    showEmpty(
      "Playlist error:\n" +
      result.error.message +
      "\n\nCheck Supabase RLS policy, anon/publishable key, and table name."
    );

    setDebug(
      "Error: " + result.error.message
    );

    return;
  }

  playlist =
    result.data || [];

  setDebug(
    "Active playlist items found: " + playlist.length
  );

  if(!playlist.length){

    showEmpty(
      "No active playlist items.\n\nCheck that at least one item in Supabase has is_active = true."
    );

    return;
  }

  if(shouldKeepCurrent && oldId){

    const matchingIndex =
      playlist.findIndex(
        item => item.id === oldId
      );

    if(matchingIndex !== -1){

      currentIndex =
        matchingIndex;

    }else{

      currentIndex =
        0;
    }

  }else if(currentIndex >= playlist.length){

    currentIndex =
      0;
  }

  if(!hasStarted || shouldRestart){

    hasStarted =
      true;

    showItem(
      currentIndex
    );
  }
}

/* =========================
   SHOW ITEM
========================= */

function showItem(index){

  clearTimer();

  if(!playlist.length){

    showEmpty(
      "No active playlist items."
    );

    return;
  }

  const item =
    playlist[index];

  if(!item){

    showEmpty(
      "Playlist item could not be loaded."
    );

    return;
  }

  stage.innerHTML =
    "";

  overlay.classList.remove(
    "hidden"
  );

  titleEl.innerText =
    item.title || "";

  counter.innerText =
    `${index + 1} / ${playlist.length}`;

  setDebug(
    "Playing: " +
    (item.title || "Untitled") +
    " | " +
    (item.file_type || "unknown type")
  );

  let el;

  if(isImage(item.file_type)){

    el =
      document.createElement("img");

    el.src =
      item.public_url;

    el.alt =
      item.title || "Playlist image";

    el.className =
      "media";

    el.onload =
      () => {

        setDebug(
          "Playing image: " +
          (item.title || "Untitled")
        );
      };

    el.onerror =
      () => {

        setDebug(
          "Image failed to load. Check that the hr-content bucket is public."
        );

        scheduleNext(
          3
        );
      };

    stage.appendChild(
      el
    );

    scheduleNext(
      item.duration_seconds
    );

  }else if(isVideo(item.file_type)){

    el =
      document.createElement("video");

    el.src =
      item.public_url;

    el.className =
      "media";

    el.autoplay =
      true;

    el.muted =
      true;

    el.playsInline =
      true;

    el.controls =
      false;

    stage.appendChild(
      el
    );

    el.addEventListener(
      "loadeddata",
      () => {

        setDebug(
          "Playing video: " +
          (item.title || "Untitled")
        );
      }
    );

    el.addEventListener(
      "ended",
      nextItem
    );

    el.addEventListener(
      "error",
      () => {

        setDebug(
          "Video failed to load. Check file URL and bucket visibility."
        );

        scheduleNext(
          3
        );
      }
    );

    el.play().catch(() => {

      setDebug(
        "Video autoplay was blocked or delayed. Trying next item after duration."
      );
    });

    scheduleNext(
      item.duration_seconds
    );

  }else if(isPdf(item.file_type)){

    el =
      document.createElement("iframe");

    el.src =
      item.public_url;

    el.className =
      "media";

    stage.appendChild(
      el
    );

    scheduleNext(
      item.duration_seconds
    );

  }else{

    const link =
      document.createElement("a");

    link.href =
      item.public_url;

    link.target =
      "_blank";

    link.rel =
      "noopener noreferrer";

    link.innerText =
      item.title || "Open file";

    link.style.color =
      "#38bdf8";

    link.style.fontSize =
      "2rem";

    stage.appendChild(
      link
    );

    scheduleNext(
      item.duration_seconds
    );
  }
}

/* =========================
   REALTIME REFRESH
========================= */

function startRealtimeRefresh(){

  realtimeChannel =
    supabase
      .channel("playlist-items-live-refresh")
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"playlist_items"
        },
        async payload => {

          setDebug(
            "Playlist changed. Refreshing..."
          );

          await loadPlaylist({
            restart:true,
            keepCurrent:true
          });
        }
      )
      .subscribe(status => {

        if(status === "SUBSCRIBED"){

          setDebug(
            "Realtime connected. Waiting for playlist changes..."
          );

        }else{

          setDebug(
            "Realtime status: " + status
          );
        }
      });
}

/* =========================
   BACKUP REFRESH
========================= */

setInterval(
  () => {

    loadPlaylist({
      restart:false,
      keepCurrent:true
    });
  },
  30000
);

/* =========================
   START
========================= */

loadPlaylist({
  restart:true
});

startRealtimeRefresh();
</script>

</body>
</html>
