<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HR Display Playlist</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#020617;
  color:white;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

#stage{
  position:fixed;
  inset:0;
  background:#020617;
  display:flex;
  align-items:center;
  justify-content:center;
}

.media{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#020617;
}

iframe.media{
  border:none;
}

#empty{
  text-align:center;
  color:#cbd5e1;
  font-size:2rem;
  padding:30px;
}

#overlay{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:18px 28px;
  background:linear-gradient(
    to top,
    rgba(0,0,0,0.75),
    rgba(0,0,0,0)
  );
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-end;
  pointer-events:none;
}

#title{
  font-size:1.6rem;
  font-weight:900;
  text-transform:uppercase;
  text-shadow:0 2px 8px rgba(0,0,0,0.8);
}

#counter{
  font-size:1rem;
  color:#cbd5e1;
  font-weight:bold;
  text-shadow:0 2px 8px rgba(0,0,0,0.8);
}

.hidden{
  display:none !important;
}
</style>
</head>

<body>

<div id="stage">
  <div id="empty">
    Loading playlist...
  </div>
</div>

<div id="overlay" class="hidden">
  <div id="title"></div>
  <div id="counter"></div>
</div>

<script type="module">
import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL =
  "https://scnlepcadipdhhzppovq.supabase.co/functions/v1/hr-admin";

const SUPABASE_ANON_KEY =
  "sb_publishable_FSLIkrVTT9GkAxXjTWoWTw_g9_BsURe";

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

const stage =
  document.getElementById("stage");

const empty =
  document.getElementById("empty");

const overlay =
  document.getElementById("overlay");

const titleEl =
  document.getElementById("title");

const counter =
  document.getElementById("counter");

let playlist =
  [];

let currentIndex =
  0;

let timer =
  null;

function isImage(fileType){

  return fileType &&
    fileType.startsWith("image/");
}

function isVideo(fileType){

  return fileType &&
    fileType.startsWith("video/");
}

function isPdf(fileType){

  return fileType === "application/pdf";
}

function clearTimer(){

  if(timer){
    clearTimeout(timer);
    timer = null;
  }
}

async function loadPlaylist(){

  const { data, error } =
    await supabase
      .from("playlist_items")
      .select("*")
      .eq("is_active",true)
      .order(
        "sort_order",
        {
          ascending:true
        }
      );

  if(error){

    showEmpty(
      error.message
    );

    return;
  }

  playlist =
    data || [];

  if(!playlist.length){

    showEmpty(
      "No active playlist items."
    );

    return;
  }

  if(currentIndex >= playlist.length){
    currentIndex = 0;
  }

  showItem(
    currentIndex
  );
}

function showEmpty(message){

  clearTimer();

  stage.innerHTML =
    "";

  const div =
    document.createElement("div");

  div.id =
    "empty";

  div.innerText =
    message;

  stage.appendChild(div);

  overlay.classList.add(
    "hidden"
  );
}

function showItem(index){

  clearTimer();

  if(!playlist.length){

    showEmpty(
      "No active playlist items."
    );

    return;
  }

  const item =
    playlist[index];

  stage.innerHTML =
    "";

  overlay.classList.remove(
    "hidden"
  );

  titleEl.innerText =
    item.title || "";

  counter.innerText =
    `${index + 1} / ${playlist.length}`;

  let el;

  if(isImage(item.file_type)){

    el =
      document.createElement("img");

    el.src =
      item.public_url;

    el.alt =
      item.title || "Playlist image";

    el.className =
      "media";

    stage.appendChild(el);

    scheduleNext(
      item.duration_seconds
    );

  }else if(isVideo(item.file_type)){

    el =
      document.createElement("video");

    el.src =
      item.public_url;

    el.className =
      "media";

    el.autoplay =
      true;

    el.muted =
      true;

    el.playsInline =
      true;

    stage.appendChild(el);

    el.addEventListener(
      "ended",
      nextItem
    );

    scheduleNext(
      item.duration_seconds
    );

    el.play().catch(() => {
      scheduleNext(
        item.duration_seconds
      );
    });

  }else if(isPdf(item.file_type)){

    el =
      document.createElement("iframe");

    el.src =
      item.public_url;

    el.className =
      "media";

    stage.appendChild(el);

    scheduleNext(
      item.duration_seconds
    );

  }else{

    const link =
      document.createElement("a");

    link.href =
      item.public_url;

    link.target =
      "_blank";

    link.innerText =
      item.title || "Open file";

    link.style.color =
      "#38bdf8";

    link.style.fontSize =
      "2rem";

    stage.appendChild(link);

    scheduleNext(
      item.duration_seconds
    );
  }
}

function scheduleNext(seconds){

  const safeSeconds =
    Math.max(
      1,
      Number(seconds || 10)
    );

  timer =
    setTimeout(
      nextItem,
      safeSeconds * 1000
    );
}

function nextItem(){

  clearTimer();

  if(!playlist.length){
    return;
  }

  currentIndex =
    (currentIndex + 1) % playlist.length;

  showItem(
    currentIndex
  );
}

setInterval(
  async () => {

    const oldLength =
      playlist.length;

    const oldId =
      playlist[currentIndex]?.id;

    const { data, error } =
      await supabase
        .from("playlist_items")
        .select("*")
        .eq("is_active",true)
        .order(
          "sort_order",
          {
            ascending:true
          }
        );

    if(error){
      return;
    }

    playlist =
      data || [];

    if(!playlist.length){

      showEmpty(
        "No active playlist items."
      );

      return;
    }

    const newIndex =
      playlist.findIndex(
        item => item.id === oldId
      );

    if(newIndex !== -1){
      currentIndex = newIndex;
    }else if(currentIndex >= playlist.length){
      currentIndex = 0;
    }

    if(oldLength === 0){
      showItem(
        currentIndex
      );
    }

  },
  30000
);

loadPlaylist();
</script>

</body>
</html>
