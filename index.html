<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  Barclays Center Employee Lounge
</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020617;
}

body{
  font-family:Arial,sans-serif;
}

/* =================================================
   MAIN STAGE
================================================= */

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#020617;
}

/* =================================================
   PERMANENT BACKGROUND

   Keep background.png in the same
   GitHub folder as index.html.
================================================= */

#backgroundLayer{
  position:absolute;
  inset:0;

  background-color:#020617;
  background-image:url("./background.png");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  z-index:0;
}

/*
  Slight dim over the background only.

  This sits BELOW all playlist media.
*/

#backgroundShade{
  position:absolute;
  inset:0;

  background:
    rgba(0,0,0,0.15);

  z-index:1;

  pointer-events:none;
}

/* =================================================
   PLAYLIST MEDIA LAYERS
================================================= */

.layer{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0;

  transition:
    opacity 0.6s ease;

  z-index:2;

  pointer-events:none;
}

.layer.active{
  opacity:1;
  z-index:3;
}

/*
  IMPORTANT:

  The media itself no longer fills a
  100% x 100% element.

  Instead, it keeps its actual aspect
  ratio and is limited to the screen.

  This allows background.jpg to remain
  visible around non-16:9 content.
*/

.media{
  display:block;

  width:auto;
  height:auto;

  max-width:100%;
  max-height:100%;

  object-fit:contain;
  object-position:center;

  background:transparent;
}

/* Images */

img.media{
  width:auto;
  height:auto;

  max-width:100vw;
  max-height:100vh;
}

/* Videos */

video.media{
  width:auto;
  height:auto;

  max-width:100vw;
  max-height:100vh;

  background:transparent;
}

</style>
</head>

<body>

<div id="stage">

  <!--
    Permanent fallback background.
    This never gets replaced by playlist content.
  -->
  <div id="backgroundLayer"></div>

  <div id="backgroundShade"></div>

  <!-- Playlist crossfade layers -->
  <div
    id="layerA"
    class="layer"
  ></div>

  <div
    id="layerB"
    class="layer"
  ></div>

</div>

<script>

/* =================================================
   CLOUDFLARE WORKER
================================================= */

const WORKER_URL =
  "https://barclays-employee-lounge-api.barclayscenterav.workers.dev";

/* =================================================
   SETTINGS
================================================= */

const PLAYLIST_CHECK_INTERVAL =
  15000;

const FADE_TIME =
  600;

const FAILED_MEDIA_DELAY =
  1500;

const VIDEO_LOAD_TIMEOUT =
  20000;

/* =================================================
   ELEMENTS
================================================= */

const layerA =
  document.getElementById(
    "layerA"
  );

const layerB =
  document.getElementById(
    "layerB"
  );

/* =================================================
   PLAYER STATE
================================================= */

let playlist =
  [];

let currentIndex =
  0;

let currentItemId =
  null;

let activeLayer =
  layerA;

let inactiveLayer =
  layerB;

let playbackTimer =
  null;

let transitionNumber =
  0;

let refreshRunning =
  false;

let playerStarted =
  false;

/* =================================================
   BASIC HELPERS
================================================= */

function cleanWorkerUrl(){

  return WORKER_URL
    .replace(/\/+$/,"");
}

function clearPlaybackTimer(){

  if(playbackTimer){

    clearTimeout(
      playbackTimer
    );

    playbackTimer =
      null;
  }
}

/* =================================================
   LAYER CLEANUP
================================================= */

function clearLayer(layer){

  const videos =
    layer.querySelectorAll(
      "video"
    );

  videos.forEach(
    video => {

      try{
        video.pause();
      }catch(error){}

      video.removeAttribute(
        "src"
      );

      try{
        video.load();
      }catch(error){}
    }
  );

  layer.innerHTML =
    "";

  layer.classList.remove(
    "active"
  );
}

function clearEverything(){

  transitionNumber++;

  clearPlaybackTimer();

  clearLayer(
    layerA
  );

  clearLayer(
    layerB
  );

  activeLayer =
    layerA;

  inactiveLayer =
    layerB;

  currentItemId =
    null;

  currentIndex =
    0;

  playerStarted =
    false;
}

/* =================================================
   FETCH PLAYLIST
================================================= */

async function fetchPlaylist(){

  const url =
    cleanWorkerUrl() +
    "/api/playlist?t=" +
    Date.now();

  const response =
    await fetch(
      url,
      {
        method:"GET",
        cache:"no-store",

        headers:{
          "Accept":
            "application/json"
        }
      }
    );

  if(!response.ok){

    throw new Error(
      "Unable to load playlist."
    );
  }

  const data =
    await response.json();

  if(
    !data ||
    !Array.isArray(
      data.items
    )
  ){

    return [];
  }

  return data.items;
}

/* =================================================
   REFRESH PLAYLIST
================================================= */

async function refreshPlaylist(){

  if(refreshRunning){
    return;
  }

  refreshRunning =
    true;

  try{

    const newPlaylist =
      await fetchPlaylist();

    const previousItemId =
      currentItemId;

    playlist =
      newPlaylist;

    /*
      No published playlist items.

      Both media layers clear,
      leaving background.jpg visible.
    */

    if(!playlist.length){

      clearEverything();

      return;
    }

    if(
      !playerStarted ||
      !previousItemId
    ){

      currentIndex =
        0;

      await showCurrentItem();

      return;
    }

    /*
      See whether currently displayed
      item is still published.
    */

    const existingIndex =
      playlist.findIndex(
        item =>
          String(item.id) ===
          String(previousItemId)
      );

    if(existingIndex >= 0){

      currentIndex =
        existingIndex;

      return;
    }

    /*
      Current item was unpublished
      or deleted.
    */

    currentIndex =
      0;

    await showCurrentItem();

  }catch(error){

    console.error(
      "Playlist refresh error:",
      error
    );

  }finally{

    refreshRunning =
      false;
  }
}

/* =================================================
   IMAGE LOADER
================================================= */

function createImage(item){

  return new Promise(
    (resolve,reject) => {

      const image =
        document.createElement(
          "img"
        );

      image.className =
        "media";

      image.alt =
        "";

      image.draggable =
        false;

      image.onload =
        () => {

          resolve(image);
        };

      image.onerror =
        () => {

          reject(
            new Error(
              "Image failed to load."
            )
          );
        };

      image.src =
        item.media_url;
    }
  );
}

/* =================================================
   VIDEO LOADER
================================================= */

function createVideo(item){

  return new Promise(
    (resolve,reject) => {

      const video =
        document.createElement(
          "video"
        );

      video.className =
        "media";

      video.autoplay =
        false;

      video.muted =
        true;

      video.defaultMuted =
        true;

      video.playsInline =
        true;

      video.controls =
        false;

      video.loop =
        false;

      video.preload =
        "auto";

      video.setAttribute(
        "playsinline",
        ""
      );

      video.setAttribute(
        "webkit-playsinline",
        ""
      );

      let finished =
        false;

      let timeout =
        null;

      function cleanup(){

        if(timeout){

          clearTimeout(
            timeout
          );

          timeout =
            null;
        }
      }

      function ready(){

        if(finished){
          return;
        }

        finished =
          true;

        cleanup();

        resolve(
          video
        );
      }

      function failed(){

        if(finished){
          return;
        }

        finished =
          true;

        cleanup();

        reject(
          new Error(
            "Video failed to load or is not supported by this browser."
          )
        );
      }

      video.addEventListener(
        "loadeddata",
        ready,
        {
          once:true
        }
      );

      video.addEventListener(
        "canplay",
        ready,
        {
          once:true
        }
      );

      video.addEventListener(
        "error",
        failed,
        {
          once:true
        }
      );

      video.src =
        item.media_url;

      video.load();

      timeout =
        setTimeout(
          failed,
          VIDEO_LOAD_TIMEOUT
        );
    }
  );
}

/* =================================================
   CREATE MEDIA
================================================= */

async function createMedia(item){

  const type =
    String(
      item.file_type || ""
    ).toLowerCase();

  if(
    type.startsWith(
      "image/"
    )
  ){

    return await createImage(
      item
    );
  }

  if(
    type.startsWith(
      "video/"
    )
  ){

    return await createVideo(
      item
    );
  }

  throw new Error(
    "Unsupported media type: " +
    type
  );
}

/* =================================================
   NEXT ITEM
================================================= */

function moveToNextItem(
  expectedItemId = null
){

  if(
    expectedItemId !== null &&
    String(currentItemId) !==
    String(expectedItemId)
  ){

    return;
  }

  if(!playlist.length){

    clearEverything();

    return;
  }

  const currentPosition =
    playlist.findIndex(
      item =>
        String(item.id) ===
        String(currentItemId)
    );

  if(currentPosition >= 0){

    currentIndex =
      (
        currentPosition + 1
      ) %
      playlist.length;

  }else{

    currentIndex =
      0;
  }

  showCurrentItem();
}

/* =================================================
   PLAY CURRENT ITEM
================================================= */

async function showCurrentItem(){

  clearPlaybackTimer();

  if(!playlist.length){

    clearEverything();

    return;
  }

  if(
    currentIndex < 0 ||
    currentIndex >=
      playlist.length
  ){

    currentIndex =
      0;
  }

  const item =
    playlist[
      currentIndex
    ];

  const thisTransition =
    ++transitionNumber;

  let media;

  try{

    media =
      await createMedia(
        item
      );

  }catch(error){

    console.error(
      "Media load error:",
      item,
      error
    );

    /*
      Keep existing media visible.

      If nothing else is visible,
      background.jpg remains visible.
    */

    if(
      thisTransition ===
      transitionNumber
    ){

      playbackTimer =
        setTimeout(
          () => {

            moveToNextItem();

          },
          FAILED_MEDIA_DELAY
        );
    }

    return;
  }

  if(
    thisTransition !==
      transitionNumber
  ){

    if(
      media.tagName ===
      "VIDEO"
    ){

      try{
        media.pause();
      }catch(error){}
    }

    return;
  }

  /*
    Build the next item while the
    existing layer stays on-screen.
  */

  clearLayer(
    inactiveLayer
  );

  inactiveLayer.appendChild(
    media
  );

  currentItemId =
    item.id;

  playerStarted =
    true;

  /* =================================================
     VIDEO PLAYBACK
  ================================================= */

  if(
    media.tagName ===
    "VIDEO"
  ){

    const itemId =
      item.id;

    media.addEventListener(
      "ended",
      () => {

        moveToNextItem(
          itemId
        );

      },
      {
        once:true
      }
    );

    media.addEventListener(
      "error",
      () => {

        moveToNextItem(
          itemId
        );

      },
      {
        once:true
      }
    );

    try{

      media.currentTime =
        0;

      await media.play();

    }catch(error){

      console.error(
        "Video autoplay/playback error:",
        error
      );
    }
  }

  /* =================================================
     CROSSFADE
  ================================================= */

  const oldLayer =
    activeLayer;

  inactiveLayer.classList.add(
    "active"
  );

  oldLayer.classList.remove(
    "active"
  );

  activeLayer =
    inactiveLayer;

  inactiveLayer =
    oldLayer;

  setTimeout(
    () => {

      clearLayer(
        inactiveLayer
      );

    },
    FADE_TIME + 100
  );

  /* =================================================
     DISPLAY DURATION
  ================================================= */

  const durationSeconds =
    Math.max(
      1,
      Number(
        item.duration_seconds ||
        10
      )
    );

  /*
    Images use their configured
    duration.
  */

  if(
    media.tagName ===
    "IMG"
  ){

    playbackTimer =
      setTimeout(
        () => {

          moveToNextItem(
            item.id
          );

        },
        durationSeconds *
        1000
      );

    return;
  }

  /*
    Videos advance using their ended
    event.

    This timer is a safety backup.
  */

  playbackTimer =
    setTimeout(
      () => {

        moveToNextItem(
          item.id
        );

      },
      (
        durationSeconds +
        5
      ) *
      1000
    );
}

/* =================================================
   TAB / DISPLAY RECOVERY
================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState !==
      "visible"
    ){
      return;
    }

    refreshPlaylist();

    const activeVideo =
      activeLayer.querySelector(
        "video"
      );

    if(activeVideo){

      activeVideo
        .play()
        .catch(
          error => {

            console.error(
              "Unable to resume video:",
              error
            );
          }
        );
    }
  }
);

/* =================================================
   INTERNET RECOVERY
================================================= */

window.addEventListener(
  "online",
  () => {

    refreshPlaylist();
  }
);

/* =================================================
   START
================================================= */

refreshPlaylist();

setInterval(
  refreshPlaylist,
  PLAYLIST_CHECK_INTERVAL
);

</script>

</body>
</html>
