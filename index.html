<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HR Display Playlist</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#020617;
  color:white;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

#stage{
  position:fixed;
  inset:0;
  background:#020617;
  display:flex;
  align-items:center;
  justify-content:center;
}

.media{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#020617;
}

iframe.media{
  border:none;
}

#empty{
  text-align:center;
  color:#cbd5e1;
  font-size:2rem;
  padding:30px;
  line-height:1.35;
}

.hidden{
  display:none !important;
}
</style>
</head>

<body>

<div id="stage">
  <div id="empty">
    Loading playlist...
  </div>
</div>

<script type="module">
import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
  "https://scnlepcadipdhhzppovq.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_FSLIkrVTT9GkAxXjTWoWTw_g9_BsURe";

/* =========================
   CLIENT
========================= */

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

/* =========================
   ELEMENTS
========================= */

const stage =
  document.getElementById("stage");

/* =========================
   STATE
========================= */

let playlist =
  [];

let currentIndex =
  0;

let timer =
  null;

let hasStarted =
  false;

let realtimeChannel =
  null;

/* =========================
   HELPERS
========================= */

function isImage(fileType){

  return fileType &&
    fileType.startsWith("image/");
}

function isVideo(fileType){

  return fileType &&
    fileType.startsWith("video/");
}

function isPdf(fileType){

  return fileType === "application/pdf";
}

function clearTimer(){

  if(timer){
    clearTimeout(timer);
    timer = null;
  }
}

function showEmpty(message){

  clearTimer();

  stage.innerHTML =
    "";

  const div =
    document.createElement("div");

  div.id =
    "empty";

  div.innerText =
    message;

  stage.appendChild(
    div
  );
}

function scheduleNext(seconds){

  const safeSeconds =
    Math.max(
      1,
      Number(seconds || 10)
    );

  timer =
    setTimeout(
      nextItem,
      safeSeconds * 1000
    );
}

function nextItem(){

  clearTimer();

  if(!playlist.length){

    showEmpty(
      "No active playlist items."
    );

    return;
  }

  currentIndex =
    (currentIndex + 1) % playlist.length;

  showItem(
    currentIndex
  );
}

/* =========================
   LOAD PLAYLIST
========================= */

async function loadPlaylist(options = {}){

  const shouldRestart =
    options.restart === true;

  const shouldKeepCurrent =
    options.keepCurrent === true;

  const oldId =
    playlist[currentIndex]?.id || null;

  const result =
    await supabase
      .from("playlist_items")
      .select("*")
      .eq("is_active",true)
      .order(
        "sort_order",
        {
          ascending:true
        }
      );

  if(result.error){

    showEmpty(
      "Playlist error. Check Supabase setup."
    );

    return;
  }

  playlist =
    result.data || [];

  if(!playlist.length){

    showEmpty(
      "No active playlist items."
    );

    return;
  }

  if(shouldKeepCurrent && oldId){

    const matchingIndex =
      playlist.findIndex(
        item => item.id === oldId
      );

    if(matchingIndex !== -1){

      currentIndex =
        matchingIndex;

    }else{

      currentIndex =
        0;
    }

  }else if(currentIndex >= playlist.length){

    currentIndex =
      0;
  }

  if(!hasStarted || shouldRestart){

    hasStarted =
      true;

    showItem(
      currentIndex
    );
  }
}

/* =========================
   SHOW ITEM
========================= */

function showItem(index){

  clearTimer();

  if(!playlist.length){

    showEmpty(
      "No active playlist items."
    );

    return;
  }

  const item =
    playlist[index];

  if(!item){

    showEmpty(
      "Playlist item could not be loaded."
    );

    return;
  }

  stage.innerHTML =
    "";

  let el;

  if(isImage(item.file_type)){

    el =
      document.createElement("img");

    el.src =
      item.public_url;

    el.alt =
      "";

    el.className =
      "media";

    el.onerror =
      () => {

        scheduleNext(
          3
        );
      };

    stage.appendChild(
      el
    );

    scheduleNext(
      item.duration_seconds
    );

  }else if(isVideo(item.file_type)){

    el =
      document.createElement("video");

    el.src =
      item.public_url;

    el.className =
      "media";

    el.autoplay =
      true;

    el.muted =
      true;

    el.playsInline =
      true;

    el.controls =
      false;

    stage.appendChild(
      el
    );

    el.addEventListener(
      "ended",
      nextItem
    );

    el.addEventListener(
      "error",
      () => {

        scheduleNext(
          3
        );
      }
    );

    el.play().catch(() => {});

    scheduleNext(
      item.duration_seconds
    );

  }else if(isPdf(item.file_type)){

    el =
      document.createElement("iframe");

    el.src =
      item.public_url;

    el.className =
      "media";

    stage.appendChild(
      el
    );

    scheduleNext(
      item.duration_seconds
    );

  }else{

    scheduleNext(
      3
    );
  }
}

/* =========================
   REALTIME REFRESH
========================= */

function startRealtimeRefresh(){

  realtimeChannel =
    supabase
      .channel("playlist-items-live-refresh")
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"playlist_items"
        },
        async payload => {

          await loadPlaylist({
            restart:true,
            keepCurrent:true
          });
        }
      )
      .subscribe();
}

/* =========================
   BACKUP REFRESH
========================= */

setInterval(
  () => {

    loadPlaylist({
      restart:false,
      keepCurrent:true
    });
  },
  30000
);

/* =========================
   START
========================= */

loadPlaylist({
  restart:true
});

startRealtimeRefresh();
</script>

</body>
</html>
