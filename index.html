<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HR Display Playlist</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020617;
  font-family:Arial,sans-serif;
}

#stage{
  position:fixed;
  inset:0;
  background:#020617;
  overflow:hidden;
}

.layer{
  position:absolute;
  inset:0;
  background:#020617;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transition:opacity 0.6s ease;
  z-index:1;
}

.layer.active{
  opacity:1;
  z-index:2;
}

.media{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#020617;
  display:block;
}

iframe.media{
  border:none;
}

#empty{
  position:fixed;
  inset:0;
  background:#020617;
  color:#cbd5e1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:2rem;
  padding:30px;
  line-height:1.35;
  z-index:10;
}

.hidden{
  display:none !important;
}
</style>
</head>

<body>

<div id="stage">
  <div id="layerA" class="layer active"></div>
  <div id="layerB" class="layer"></div>
</div>

<div id="empty">
  Loading playlist...
</div>

<script type="module">
import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
  "https://scnlepcadipdhhzppovq.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_FSLIkrVTT9GkAxXjTWoWTw_g9_BsURe";

/* =========================
   CLIENT
========================= */

const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

/* =========================
   ELEMENTS
========================= */

const layerA =
  document.getElementById("layerA");

const layerB =
  document.getElementById("layerB");

const empty =
  document.getElementById("empty");

/* =========================
   STATE
========================= */

let playlist =
  [];

let currentIndex =
  0;

let activeLayer =
  layerA;

let standbyLayer =
  layerB;

let timer =
  null;

let hasStarted =
  false;

let isSwitching =
  false;

let realtimeChannel =
  null;

/* =========================
   HELPERS
========================= */

function isImage(fileType){

  return fileType &&
    fileType.startsWith("image/");
}

function isVideo(fileType){

  return fileType &&
    fileType.startsWith("video/");
}

function isPdf(fileType){

  return fileType === "application/pdf";
}

function clearTimer(){

  if(timer){
    clearTimeout(timer);
    timer = null;
  }
}

function hideEmpty(){

  empty.classList.add(
    "hidden"
  );
}

function showEmpty(message){

  clearTimer();

  empty.innerText =
    message;

  empty.classList.remove(
    "hidden"
  );
}

function scheduleNext(seconds){

  const safeSeconds =
    Math.max(
      1,
      Number(seconds || 10)
    );

  timer =
    setTimeout(
      nextItem,
      safeSeconds * 1000
    );
}

function swapLayers(){

  standbyLayer.classList.add(
    "active"
  );

  activeLayer.classList.remove(
    "active"
  );

  const oldLayer =
    activeLayer;

  activeLayer =
    standbyLayer;

  standbyLayer =
    oldLayer;

  setTimeout(
    () => {

      standbyLayer.innerHTML =
        "";

    },
    700
  );
}

/* =========================
   MEDIA CREATION
========================= */

function createImageElement(item){

  return new Promise(resolve => {

    const img =
      document.createElement("img");

    img.src =
      item.public_url;

    img.alt =
      "";

    img.className =
      "media";

    img.onload =
      () => resolve(img);

    img.onerror =
      () => resolve(null);
  });
}

function createVideoElement(item){

  return new Promise(resolve => {

    const video =
      document.createElement("video");

    video.src =
      item.public_url;

    video.className =
      "media";

    video.autoplay =
      true;

    video.muted =
      true;

    video.playsInline =
      true;

    video.controls =
      false;

    video.preload =
      "auto";

    let resolved =
      false;

    function finish(){

      if(resolved){
        return;
      }

      resolved =
        true;

      resolve(video);
    }

    video.addEventListener(
      "loadeddata",
      finish,
      {
        once:true
      }
    );

    video.addEventListener(
      "canplay",
      finish,
      {
        once:true
      }
    );

    video.addEventListener(
      "error",
      () => resolve(null),
      {
        once:true
      }
    );

    setTimeout(
      finish,
      2000
    );

    video.load();
  });
}

function createPdfElement(item){

  return new Promise(resolve => {

    const iframe =
      document.createElement("iframe");

    iframe.src =
      item.public_url;

    iframe.className =
      "media";

    iframe.onload =
      () => resolve(iframe);

    setTimeout(
      () => resolve(iframe),
      800
    );
  });
}

async function createMediaElement(item){

  if(isImage(item.file_type)){

    return await createImageElement(
      item
    );
  }

  if(isVideo(item.file_type)){

    return await createVideoElement(
      item
    );
  }

  if(isPdf(item.file_type)){

    return await createPdfElement(
      item
    );
  }

  return null;
}

/* =========================
   PLAYBACK
========================= */

async function showItem(index){

  if(isSwitching){
    return;
  }

  clearTimer();

  if(!playlist.length){

    showEmpty(
      "No active playlist items."
    );

    return;
  }

  const item =
    playlist[index];

  if(!item){

    showEmpty(
      "Playlist item could not be loaded."
    );

    return;
  }

  isSwitching =
    true;

  const mediaElement =
    await createMediaElement(
      item
    );

  if(!mediaElement){

    isSwitching =
      false;

    scheduleNext(
      3
    );

    return;
  }

  standbyLayer.innerHTML =
    "";

  standbyLayer.appendChild(
    mediaElement
  );

  hideEmpty();

  swapLayers();

  if(isVideo(item.file_type)){

    mediaElement.currentTime =
      0;

    mediaElement.play().catch(() => {});

    mediaElement.addEventListener(
      "ended",
      nextItem,
      {
        once:true
      }
    );
  }

  scheduleNext(
    item.duration_seconds
  );

  isSwitching =
    false;
}

function nextItem(){

  clearTimer();

  if(!playlist.length){

    showEmpty(
      "No active playlist items."
    );

    return;
  }

  currentIndex =
    (currentIndex + 1) % playlist.length;

  showItem(
    currentIndex
  );
}

/* =========================
   LOAD PLAYLIST
========================= */

async function loadPlaylist(options = {}){

  const shouldRestart =
    options.restart === true;

  const shouldKeepCurrent =
    options.keepCurrent === true;

  const oldId =
    playlist[currentIndex]?.id || null;

  const result =
    await supabase
      .from("playlist_items")
      .select("*")
      .eq("is_active",true)
      .order(
        "sort_order",
        {
          ascending:true
        }
      );

  if(result.error){

    showEmpty(
      "Playlist error. Check Supabase setup."
    );

    return;
  }

  playlist =
    result.data || [];

  if(!playlist.length){

    showEmpty(
      "No active playlist items."
    );

    return;
  }

  if(shouldKeepCurrent && oldId){

    const matchingIndex =
      playlist.findIndex(
        item => item.id === oldId
      );

    if(matchingIndex !== -1){

      currentIndex =
        matchingIndex;

    }else{

      currentIndex =
        0;
    }

  }else if(currentIndex >= playlist.length){

    currentIndex =
      0;
  }

  if(!hasStarted || shouldRestart){

    hasStarted =
      true;

    showItem(
      currentIndex
    );
  }
}

/* =========================
   REALTIME REFRESH
========================= */

function startRealtimeRefresh(){

  realtimeChannel =
    supabase
      .channel("playlist-items-live-refresh")
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"playlist_items"
        },
        async () => {

          await loadPlaylist({
            restart:true,
            keepCurrent:true
          });
        }
      )
      .subscribe();
}

/* =========================
   BACKUP REFRESH
========================= */

setInterval(
  () => {

    loadPlaylist({
      restart:false,
      keepCurrent:true
    });
  },
  30000
);

/* =========================
   START
========================= */

loadPlaylist({
  restart:true
});

startRealtimeRefresh();
</script>

</body>
</html>
